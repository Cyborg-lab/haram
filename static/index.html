<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telefon Bozor</title><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main><header><div><p class="eyebrow">TELEFON BOZOR</p><h1>Yangi telefoningizni toping</h1></div><button id="profileBtn" class="avatar">👤</button></header>
<section class="search"><input id="search" placeholder="Model yoki brend qidiring"><button id="searchBtn">Qidirish</button></section>
<nav><button class="tab active" data-view="market">E'lonlar</button><button class="tab" data-view="add">＋ E'lon qo'shish</button><button class="tab" data-view="mine">E'lonlarim</button></nav>
<section id="market" class="view active"><div id="ads" class="cards"></div></section>
<section id="add" class="view"><form id="adForm" class="panel"><h2>Telefon e'loni</h2><div class="grid"><label>Brend<select name="brand"><option>Apple</option><option>Samsung</option><option>Xiaomi</option><option>Redmi</option><option>Boshqa</option></select></label><label>Model<input name="model" required placeholder="Masalan, iPhone 15"></label><label>Xotira<select name="storage"><option>64 GB</option><option selected>128 GB</option><option>256 GB</option><option>512 GB</option></select></label><label>RAM<select name="ram"><option>4 GB RAM</option><option>6 GB RAM</option><option selected>8 GB RAM</option><option>12 GB RAM</option></select></label><label>Kamera<select name="camera"><option>12 MP</option><option>48 MP</option><option selected>50 MP</option><option>108 MP</option></select></label><label>Ekran<select name="screen"><option>60 Hz</option><option>90 Hz</option><option selected>120 Hz</option><option>144 Hz</option></select></label><label>Batareya<select name="battery"><option>4000 mAh</option><option>4500 mAh</option><option selected>5000 mAh</option><option>6000 mAh</option></select></label><label>Holati<select name="condition"><option>Yangi</option><option>Ideal</option><option>Ishlatilgan</option></select></label><label>Narxi<input name="price" required placeholder="3 500 000 so'm"></label><label>Rasm<input id="image" type="file" accept="image/*"></label></div><label>Qo'shimcha ma'lumot<textarea name="description" placeholder="Komplekt, nuqsoni yoki boshqa ma'lumot"></textarea></label><button class="primary">E'lonni joylash</button></form></section>
<section id="mine" class="view"><div id="myAds" class="cards"></div></section></main><dialog id="profile"><form method="dialog" class="panel"><h2>Profil</h2><p id="userName"></p><label>Telefon raqam<input id="phone" placeholder="+998 90 123 45 67"></label><div class="actions"><button value="cancel">Yopish</button><button id="saveProfile" class="primary" value="default">Saqlash</button></div></form></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
